# ~/.config/kitty/kitty.conf
# Green City Kitty
# Linux Mint / Cinnamon; portable to other Linux desktops.
# Theme derived from the included 1-glowing-city.jpg wallpaper.

# ── Font ─────────────────────────────────────────────────────────────────────
# JetBrainsMono Nerd Font is installed in ~/.local/share/fonts.
font_family        JetBrainsMono Nerd Font
font_size          13.0

# ── Shell ─────────────────────────────────────────────────────────────────────
# Use Zsh inside Kitty without changing the system login shell.
shell              /usr/bin/zsh

# ── Cursor ────────────────────────────────────────────────────────────────────
cursor_shape               block
cursor_blink_interval      0.5
cursor_stop_blinking_after 15

# ── Scrolling and selection ──────────────────────────────────────────────────
scrollback_lines    10000
mouse_hide_wait     3.0
copy_on_select      yes
strip_trailing_spaces smart

# ── Window appearance ────────────────────────────────────────────────────────
# No OS title bar or window controls. Restart Kitty after changing this.
hide_window_decorations     yes

window_padding_width        14
window_margin_width         0
single_window_margin_width  0

# Borderless terminal in this bundle.
window_border_width         0

# Compact default window: the fastfetch layout is built for 85 columns.
# Without this, kitty's default 60-column window clips the info box.
remember_window_size        no
initial_window_width        85c
initial_window_height       25c

# True transparency: let the compositor show the desktop wallpaper through.
# Kitty's own background_blur is only honored on macOS and KDE/X11. On
# Cinnamon, real dynamic blur is provided by the Blur Cinnamon extension with
# a Kitty entry enabled at the desktop level.
background_opacity          0.68
background_blur             1
dynamic_background_opacity  yes
enable_audio_bell           no

# Borderless by default. The optional green outer frame and native split
# borders are installed from optional/border/ with:
#   ./install.sh --border
# See the "Optional green border" section in README.md.

# ── Tabs ─────────────────────────────────────────────────────────────────────
tab_bar_style             powerline
tab_powerline_style       slanted
tab_bar_edge              bottom
tab_bar_margin_width      0
tab_bar_min_tabs          2
active_tab_font_style     bold
inactive_tab_font_style   normal

# ── Key mappings ─────────────────────────────────────────────────────────────
map f1 new_window_with_cwd
map f4 launch --location=split
map f5 launch --location=hsplit
map f6 launch --location=vsplit
map ctrl+shift+enter launch --cwd=current

# ── Theme ────────────────────────────────────────────────────────────────────
include current-theme.conf

# Overrides applied after the theme.
# Neutral near-black instead of a saturated green tint; transparency comes from
# background_opacity above.
background              #0b0f0d
