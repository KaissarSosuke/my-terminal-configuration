# Green City Kitty — optional border
#
# Install this file as ~/.config/kitty/green-city-border.conf, copy
# green-frame.png to ~/.config/kitty/, then add this line to the end of
# kitty.conf:
#
#   include green-city-border.conf
#
# The PNG supplies the outer frame around a single window. Kitty's native
# window_border_width only draws borders between split panes.

# Native borders between split panes.
window_border_width      1pt
draw_minimal_borders     no
active_border_color      #4FD18F
inactive_border_color    #2F6B4F

# Outer frame for a single window. The PNG is transparent in the middle and
# has a 6 px #4FD18F edge, so it does not tint the terminal background.
background_image         ~/.config/kitty/green-frame.png
background_image_layout  scaled
background_tint          0
